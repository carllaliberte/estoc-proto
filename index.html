<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#07080b"/>
<title>Estoc</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="app">
  <section class="screen on" id="splash">
    <canvas id="splashCanvas"></canvas>
    <div class="splash-copy">
      <p class="kicker">New Hall · Québec</p>
      <h1>Estoc</h1>
      <p class="lede">Read the blade. Hit the window. Miss and you eat steel.</p>
      <button class="btn solid" id="playNow" onclick="window.__estocStart&&window.__estocStart()">Salute Newsteel</button>
    </div>
  </section>
  <section class="screen" id="duel">
    <div class="strip">
      <div class="hpwrap"><b id="youLabel">Linen</b><div class="bar"><i id="youHp"></i></div></div>
      <span class="timer" id="timer">1:30</span>
      <div class="hpwrap foe"><b id="foeLabel">Newsteel</b><div class="bar foe"><i id="foeHp"></i></div></div>
    </div>
    <div class="yard" id="yard">
      <canvas id="piste"></canvas>
      <div class="floater" id="floater"></div>
    </div>
    <div class="hud">
      <p class="tell" id="tell">Watch the blade.</p>
      <div class="window"><i id="windowBar"></i></div>
      <p class="hint">A LINE · S MEASURE · D OPENING</p>
      <div class="skills" id="skills">
        <button data-s="line"><b>Line</b><small>Cuts Opening</small><kbd>A</kbd></button>
        <button data-s="measure"><b>Measure</b><small>Reads Line</small><kbd>S</kbd></button>
        <button data-s="opening"><b>Opening</b><small>Punishes Measure</small><kbd>D</kbd></button>
      </div>
    </div>
  </section>
  <section class="screen" id="result">
    <div class="result-art"><canvas id="resultCanvas"></canvas></div>
    <div class="pad">
      <p class="kicker" id="resKicker">Bout</p>
      <h1 id="resTitle">Victory</h1>
      <p class="lede" id="resLine"></p>
      <button class="btn solid" id="fightAgain">Fight next</button>
      <button class="btn ghost" id="againSame">Same steel</button>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
