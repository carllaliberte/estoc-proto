<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Estoc</title>
  <link rel="stylesheet" href="art.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section class="screen on" id="splash">
      <div class="hero hall">
        <div class="veil"></div>
      </div>
      <div class="pad">
        <p class="kicker">Hall</p>
        <h1>Estoc</h1>
        <p class="lede">Read the tell. Hit the window. Miss and you eat steel.</p>
        <button class="btn solid" id="playNow">Fight Newsteel</button>
      </div>
    </section>

    <section class="screen" id="duel">
      <div class="strip">
        <span id="youLabel">Linen</span>
        <span class="timer" id="timer">1:30</span>
        <span id="foeLabel">Newsteel</span>
      </div>
      <div class="yard hall" id="yard">
        <div class="veil"></div>
        <div class="floater" id="floater"></div>
        <figure class="side you" id="youFig">
          <div class="body you-art"></div>
          <p class="hpn" id="youHpn">100</p>
          <div class="bar"><i id="youHp"></i></div>
        </figure>
        <figure class="side foe" id="foeFig">
          <div class="body foe-art"></div>
          <p class="hpn" id="foeHpn">100</p>
          <div class="bar"><i id="foeHp"></i></div>
        </figure>
      </div>
      <p class="tell" id="tell">Watch the mask.</p>
      <div class="window"><i id="windowBar"></i></div>
      <div class="skills" id="skills">
        <button data-s="cut">Line<small>Lunge now</small></button>
        <button data-s="read">Measure<small>See the tell</small></button>
        <button data-s="kill">Opening<small>Punish a miss</small></button>
      </div>
    </section>

    <section class="screen" id="result">
      <div class="hero mask-hero"></div>
      <div class="pad">
        <p class="kicker" id="resKicker">Bout</p>
        <h1 id="resTitle">Victory</h1>
        <p class="lede" id="resLine"></p>
        <button class="btn solid" id="fightAgain">Fight next</button>
        <button class="btn ghost" id="againSame">Same steel</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
