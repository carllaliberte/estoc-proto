<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#070403"/>
<title>Estoc</title>
<style>
:root{--ink:#f3ead8;--muted:#b9a78c;--gold:#e0b36a;--ember:#e06030;--bg:#070403}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Palatino,"Palatino Linotype",Georgia,serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;appearance:none;border:0;background:0}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:#070403}
.screen{display:none;flex:1;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.screen.on{display:flex}
.kicker{letter-spacing:.34em;text-transform:uppercase;font-size:10px;color:var(--gold);font-family:Helvetica,Arial,sans-serif}
h1{font-weight:500;font-size:56px;letter-spacing:.06em;margin:6px 0 8px}
.lede{color:var(--muted);font-size:16px;line-height:1.45}
.btn{width:100%;border:1px solid var(--gold);background:transparent;color:var(--ink);padding:16px;margin-top:10px;cursor:pointer;letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-family:Helvetica,Arial,sans-serif}
.btn.solid{background:var(--gold);color:#1a1208;font-weight:600}
.btn.ghost{border-color:#4a3828;color:var(--muted)}
#splash .copy{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:28px 22px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(7,4,3,.97),transparent)}
.strip{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;font-size:13px;text-shadow:0 2px 10px #000;pointer-events:none}
.hpwrap{display:flex;flex-direction:column;gap:4px;min-width:118px}
.hpwrap.foe{align-items:flex-end}
.bar{height:6px;width:118px;background:#1a100c;overflow:hidden;border:1px solid #3a2418}
.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c45a28,#e0b36a);transition:width .16s}
.bar.foe>i{background:linear-gradient(90deg,#2a6a9a,#7ec8ff)}
.timer{font-family:Helvetica,Arial,sans-serif;letter-spacing:.22em;color:var(--gold);font-size:12px}
#stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hud{position:relative;z-index:3;background:linear-gradient(to top,#070403 78%,rgba(7,4,3,.2));padding-bottom:env(safe-area-inset-bottom)}
.tell{text-align:center;min-height:40px;padding:10px 16px 0;font-size:18px;font-style:italic}
.tell.danger{color:var(--ember)}.tell.good{color:var(--gold)}
.window{height:6px;margin:8px 16px;background:#1a100c;overflow:hidden;border:1px solid #3a2418}
.window>i{display:block;height:100%;width:0;background:var(--ember)}
.window.live>i{width:100%;background:var(--gold)}
.hint{text-align:center;color:#8a7358;font-size:10px;letter-spacing:.16em;font-family:Helvetica,Arial,sans-serif;padding:0 12px 8px}
.skills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px 14px}
.skills button{border:1px solid #3a2418;background:#140c08;color:var(--ink);padding:12px 4px 14px;cursor:pointer;min-height:88px}
.skills button b{display:block;font-size:15px}
.skills button small{display:block;margin-top:6px;color:var(--muted);font-size:10px;font-family:Helvetica,Arial,sans-serif}
.skills.hot button{border-color:rgba(224,96,48,.75)}
.floater{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:36px;opacity:0;z-index:5;font-weight:600;pointer-events:none}
.floater.on{animation:pop .55s ease}
.floater.good{color:var(--gold)}.floater.bad{color:var(--ember)}
@keyframes pop{0%{opacity:0}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px)}}
#result .art{flex:1;min-height:220px;position:relative}
#result canvas{position:absolute;inset:0;width:100%;height:100%}
#result .pad{padding:18px 22px calc(22px + env(safe-area-inset-bottom))}
.mask{color:var(--gold);font-style:italic;margin:8px 0 14px}
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="splash">
    <canvas id="splashC"></canvas>
    <div class="copy">
      <p class="kicker">Burning Hall · Québec</p>
      <h1>Estoc</h1>
      <p class="lede">Read the blade. Hit the window. Miss and you eat steel.</p>
      <button class="btn solid" id="playNow" type="button">Salute Newsteel</button>
    </div>
  </section>
  <section class="screen" id="duel">
    <div id="stage">
      <canvas id="c"></canvas>
      <div class="strip">
        <div class="hpwrap"><b id="youLabel">Linen</b><div class="bar"><i id="youHp"></i></div></div>
        <span class="timer" id="timer">1:30</span>
        <div class="hpwrap foe"><b id="foeLabel">Newsteel</b><div class="bar foe"><i id="foeHp"></i></div></div>
      </div>
      <div class="floater" id="floater"></div>
    </div>
    <div class="hud">
      <p class="tell" id="tell">Watch the blade.</p>
      <div class="window"><i id="windowBar"></i></div>
      <p class="hint">A LINE · S MEASURE · D OPENING</p>
      <div class="skills" id="skills">
        <button type="button" data-s="line"><b>Line</b><small>Cuts Opening</small></button>
        <button type="button" data-s="measure"><b>Measure</b><small>Reads Line</small></button>
        <button type="button" data-s="opening"><b>Opening</b><small>Punishes Measure</small></button>
      </div>
    </div>
  </section>
  <section class="screen" id="result">
    <div class="art"><canvas id="resC"></canvas></div>
    <div class="pad">
      <p class="kicker" id="resKicker">The mask</p>
      <h1 id="resTitle">Victory</h1>
      <p class="mask" id="resMask"></p>
      <p class="lede" id="resLine"></p>
      <button class="btn solid" id="fightAgain" type="button">Fight next</button>
      <button class="btn ghost" id="againSame" type="button">Same steel</button>
    </div>
  </section>
</div>
<script>
(function(){
const ROLES=[
  {id:"line",beats:"opening",dmg:18,pose:"line",flavor:"The point comes."},
  {id:"measure",beats:"line",dmg:14,pose:"measure",flavor:"They hold the yard."},
  {id:"opening",beats:"measure",dmg:24,pose:"opening",flavor:"The blade lifts."}
];
const BOTS=[
  {name:"Newsteel",bias:"line",biasP:.78,maskWin:"The point was already there.",maskLose:"You blinked at the lift. I never lifted."},
  {name:"Mist",bias:"measure",biasP:.74,maskWin:"I never left the yard.",maskLose:"You came. I was already home."},
  {name:"Fang",bias:"opening",biasP:.76,maskWin:"You looked up. That was enough.",maskLose:"Hunger reads faster than you."},
  {name:"Halt",bias:"measure",biasP:.80,maskWin:"Plate first. Always.",maskLose:"You threw. I waited."},
  {name:"Wake",bias:"line",biasP:.70,maskWin:"Pressure does the talking.",maskLose:"The line was mine before the salute."},
  {name:"Duelle",bias:"opening",biasP:.72,maskWin:"Blood answers a raised blade.",maskLose:"You measured a storm."},
  {name:"Mass",bias:"measure",biasP:.77,maskWin:"The strip is smaller than you thought.",maskLose:"Weight wins the quiet ones."},
  {name:"Black Estoc",bias:"opening",biasP:.66,maskWin:"Same scarf. Colder eyes.",maskLose:"You already lost this bout once."}
];
const state={name:"Linen",ladder:0,wins:0,losses:0,hp:100,foe:100,time:90,live:false,windowOpen:false,pending:null,answered:false,exchanges:0,fought:0,
  youPose:"salute",foePose:"salute",shake:0,sparks:[],dust:[]};
try{const raw=JSON.parse(localStorage.getItem("estoc.v10")||"null");if(raw){state.name=raw.name||"Linen";state.ladder=raw.ladder||0;state.wins=raw.wins||0;state.losses=raw.losses||0;}}catch(e){}
let tick=null,tellTimer=null,ctxAudio=null,raf=0;
const $=id=>document.getElementById(id);
const bot=()=>BOTS[Math.min(state.ladder,BOTS.length-1)];
const role=id=>ROLES.find(r=>r.id===id);
function persist(){localStorage.setItem("estoc.v10",JSON.stringify({name:state.name,ladder:state.ladder,wins:state.wins,losses:state.losses}));}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");sizeCanvas();}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function audioCtx(){try{ctxAudio=ctxAudio||new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return ctxAudio;}
function beep(freq,ms,type,vol){try{const c=audioCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.value=freq;g.gain.value=vol||0.05;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(ms||90)/1000);setTimeout(()=>o.stop(),(ms||90)+30);}catch(e){}}
function clash(){beep(90,80,"sawtooth",0.07);setTimeout(()=>beep(220,50,"triangle",0.04),30);state.shake=10;}
function paintHUD(){$("youHp").style.width=clamp(state.hp,0,100)+"%";$("foeHp").style.width=clamp(state.foe,0,100)+"%";$("timer").textContent=fmt(state.time);}
function say(text,cls){$("tell").textContent=text;$("tell").className="tell "+(cls||"");}
function floatTxt(n,good){const el=$("floater");el.textContent="\u2212"+n;el.className="floater on "+(good?"good":"bad");setTimeout(()=>el.classList.remove("on"),560);}
function sizeCanvas(){
  ["c","splashC","resC"].forEach(id=>{
    const el=$(id); if(!el) return;
    const r=el.parentElement.getBoundingClientRect();
    const d=Math.min(2,window.devicePixelRatio||1);
    el.width=Math.max(1,r.width*d); el.height=Math.max(1,r.height*d);
  });
}
function hall(ctx,w,h,t){
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#1a0c08"); g.addColorStop(.55,"#0c0604"); g.addColorStop(1,"#070403");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  const r1=ctx.createRadialGradient(w*.5,h*1.05,10,w*.5,h*.7,h*.9);
  r1.addColorStop(0,"rgba(194,74,24,.45)"); r1.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=r1; ctx.fillRect(0,0,w,h);
  const r2=ctx.createRadialGradient(w*.18,h*.82,8,w*.18,h*.82,w*.55);
  r2.addColorStop(0,"rgba(224,96,48,.28)"); r2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=r2; ctx.fillRect(0,0,w,h);
  const r3=ctx.createRadialGradient(w*.84,h*.78,8,w*.84,h*.78,w*.5);
  r3.addColorStop(0,"rgba(122,34,8,.32)"); r3.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=r3; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="rgba(224,179,106,.12)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(w*.08,h*.86); ctx.lineTo(w*.92,h*.86); ctx.stroke();
  if(!state.dust.length){
    for(let i=0;i<28;i++) state.dust.push({x:Math.random(),y:Math.random(),s:0.4+Math.random()*1.4,v:.0004+Math.random()*.001});
  }
  ctx.fillStyle="rgba(224,179,106,.22)";
  state.dust.forEach(p=>{p.y-=p.v; if(p.y<0)p.y=1; ctx.beginPath(); ctx.arc(p.x*w,p.y*h,p.s,0,6.28); ctx.fill();});
}
function drawBlade(ctx, hx, hy, ang, len, steel, glow){
  const tx=hx+Math.cos(ang)*len, ty=hy+Math.sin(ang)*len;
  ctx.strokeStyle=glow; ctx.lineWidth=7; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.strokeStyle=steel; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.fillStyle=steel; ctx.beginPath(); ctx.arc(tx,ty,2.6,0,6.28); ctx.fill();
}
function drawFencer(ctx, x, y, facing, pose, isYou, t){
  const plate=isYou?"#1c110c":"#0c141c";
  const rim=isYou?"#c9a46a":"#6a90b0";
  const scarf=isYou?"#c45a28":"#24344c";
  const eye=isYou?"#e06030":"#4aa0ff";
  const steel=isYou?"#f3ead8":"#d0deea";
  const glow=isYou?"rgba(224,96,48,.45)":"rgba(80,160,255,.4)";
  let bodyX=0, bladeAng=-0.18, bladeLen=122, handY=-78, lean=0;
  if(pose==="salute"){bladeAng=-1.52; bladeLen=96; handY=-96;}
  if(pose==="line"){bladeAng=-0.06; bodyX=14; bladeLen=128;}
  if(pose==="measure"){bladeAng=0.62; handY=-50; bladeLen=108; bodyX=-4;}
  if(pose==="opening"){bladeAng=-1.92; handY=-118; bladeLen=118;}
  if(pose==="lunge"){bodyX=34; bladeAng=-0.04; lean=.12; bladeLen=132;}
  if(pose==="hit"){bodyX=-18; bladeAng=0.42; lean=-.1;}
  if(pose==="guard"){bladeAng=0.35; handY=-62; bodyX=-6;}
  ctx.save();
  ctx.translate(x+bodyX*facing,y);
  ctx.scale(facing,1);
  ctx.rotate(lean);
  const sway=Math.sin(t*2.1)*1.2;
  ctx.translate(0,sway);
  ctx.fillStyle=scarf;
  ctx.beginPath(); ctx.moveTo(-6,-70); ctx.quadraticCurveTo(-28,-20,-18,18); ctx.lineTo(-4,16); ctx.quadraticCurveTo(-10,-24,6,-66); ctx.fill();
  ctx.fillStyle=plate;
  ctx.fillRect(-9,8,16,36); ctx.fillRect(4,8,12,38);
  ctx.fillRect(-16,-58,32,72);
  ctx.strokeStyle=rim; ctx.lineWidth=1.2; ctx.strokeRect(-16,-58,32,72);
  ctx.fillStyle=scarf; ctx.fillRect(-18,-64,36,8);
  ctx.beginPath(); ctx.ellipse(0,-86,18,22,0,0,6.28); ctx.fillStyle=plate; ctx.fill(); ctx.strokeStyle=rim; ctx.stroke();
  ctx.fillStyle=eye; ctx.shadowColor=eye; ctx.shadowBlur=10;
  ctx.fillRect(-8,-90,16,4);
  ctx.shadowBlur=0;
  ctx.fillStyle="#2a1810"; ctx.fillRect(-6,-74,12,6);
  const hx=22, hy=handY;
  ctx.strokeStyle=plate; ctx.lineWidth=7; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(6,-46); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(hx,hy,5,0,6.28); ctx.fill();
  drawBlade(ctx,hx,hy,bladeAng,bladeLen,steel,glow);
  ctx.restore();
}
function burst(x,y,col){
  for(let i=0;i<10;i++) state.sparks.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,life:18+Math.random()*10,col});
}
function drawSparks(ctx){
  state.sparks=state.sparks.filter(s=>s.life>0);
  state.sparks.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy; s.vy+=.18; s.life--;
    ctx.fillStyle=s.col; ctx.globalAlpha=Math.max(0,s.life/20);
    ctx.fillRect(s.x,s.y,2,2);
  });
  ctx.globalAlpha=1;
}
function drawScene(canvas, youP, foeP, t){
  const ctx=canvas.getContext("2d");
  const w=canvas.width,h=canvas.height;
  ctx.setTransform(1,0,0,1,0,0);
  hall(ctx,w,h,t);
  const sh=state.shake||0;
  if(sh){ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh); state.shake*=.82; if(state.shake<0.4)state.shake=0;}
  const ground=h*0.78;
  const youX=w*0.28, foeX=w*0.72;
  drawFencer(ctx,youX,ground,1,youP,true,t);
  drawFencer(ctx,foeX,ground,-1,foeP,false,t);
  drawSparks(ctx);
}
let t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  if($("splash").classList.contains("on")) drawScene($("splashC"),"salute","salute",t);
  if($("duel").classList.contains("on")) drawScene($("c"),state.youPose,state.foePose,t);
  if($("result").classList.contains("on")) drawScene($("resC"), state.hp>=state.foe?"salute":"hit", state.hp>=state.foe?"hit":"salute", t);
  raf=requestAnimationFrame(loop);
}
function startFight(){
  try{const c=audioCtx();if(c&&c.resume)c.resume();}catch(e){}
  const b=bot();
  state.hp=100;state.foe=100;state.time=90;state.live=true;state.windowOpen=false;state.pending=null;state.answered=false;state.exchanges=0;
  state.youPose="salute";state.foePose="salute";state.sparks=[];
  $("youLabel").textContent=state.name; $("foeLabel").textContent=b.name;
  paintHUD(); say("Salute. Then read the blade."); show("duel");
  clearInterval(tick); clearTimeout(tellTimer);
  tick=setInterval(()=>{if(!state.live)return;state.time-=1;$("timer").textContent=fmt(state.time);if(state.time<=0)endBout(state.hp>=state.foe);},1000);
  beep(220,90,"triangle",0.05);
  setTimeout(()=>{say("Watch the blade. Do not guess."); setTimeout(openTell,700);},900);
}
function pickIncoming(){
  const b=bot();
  if(Math.random()<(b.biasP||0.62)) return role(b.bias);
  return ROLES[Math.floor(Math.random()*ROLES.length)];
}
function openTell(){
  if(!state.live)return;
  const incoming=pickIncoming();
  state.pending=incoming; state.windowOpen=true; state.answered=false;
  state.foePose=incoming.pose; state.youPose="guard";
  say("Read it.", incoming.id==="opening"?"danger":"");
  const bar=$("windowBar"),win=document.querySelector(".window"),box=$("skills");
  win.classList.remove("live"); bar.style.transition="none"; bar.style.width="0"; void bar.offsetWidth;
  const ms=state.exchanges<2?1200:850;
  bar.style.transition="width "+(ms/1000)+"s linear"; win.classList.add("live"); box.classList.add("hot");
  beep(740,40,"triangle",0.03);
  clearTimeout(tellTimer);
  tellTimer=setTimeout(()=>{if(!state.live||state.answered)return;resolve(null,incoming);},ms);
}
function answer(id){
  if(!state.live)return;
  const mine=role(id); if(!mine)return;
  if(state.windowOpen&&!state.answered){
    state.answered=true; state.windowOpen=false;
    document.querySelector(".window").classList.remove("live");
    $("skills").classList.remove("hot");
    resolve(mine,state.pending); return;
  }
  if(!state.windowOpen) resolve(mine,null);
}
function resolve(mine,theirs){
  state.windowOpen=false; $("skills").classList.remove("hot");
  document.querySelector(".window").classList.remove("live");
  let dmgYou=0,dmgFoe=0,line="";
  const mid=($("c").width||400)*0.5, gy=($("c").height||400)*0.62;
  if(!mine&&theirs){
    dmgYou=theirs.id==="opening"?22:theirs.id==="line"?14:7;
    line=bot().name+" lands.";
    state.foePose="lunge"; state.youPose="hit";
    clash(); floatTxt(dmgYou,false); burst(mid*0.42,gy,"#e06030");
  } else if(mine&&!theirs){
    if(mine.id==="measure"){ line="You hold. Nothing there."; state.youPose="measure"; }
    else { dmgFoe=Math.floor(mine.dmg*0.4); line="Early. Cheap steel."; state.youPose="lunge"; state.foePose="hit"; floatTxt(dmgFoe,true); clash(); }
  } else {
    const great=mine.beats===theirs.id, clashHit=mine.id===theirs.id;
    if(great){ dmgFoe=mine.dmg; line="Clean."; state.youPose="lunge"; state.foePose="hit"; beep(520,90,"triangle",0.06); floatTxt(dmgFoe,true); burst(mid,gy,"#e0b36a"); state.shake=8;}
    else if(clashHit){ dmgFoe=8; dmgYou=6; line="Steel meets steel."; state.youPose="lunge"; state.foePose="lunge"; clash(); floatTxt(dmgFoe,true); burst(mid,gy,"#f3ead8"); }
    else { dmgYou=theirs.id==="opening"?18:theirs.id==="line"?12:6; line="Wrong read."; state.foePose="lunge"; state.youPose="hit"; clash(); floatTxt(dmgYou,false); burst(mid*0.42,gy,"#e06030"); }
  }
  state.hp=Math.max(0,state.hp-dmgYou); state.foe=Math.max(0,state.foe-dmgFoe); state.exchanges+=1;
  say(line, dmgFoe>dmgYou?"good":dmgYou?"danger":"");
  paintHUD();
  if(state.hp<=0||state.foe<=0){ endBout(state.foe<=0 && state.hp>=state.foe); return; }
  tellTimer=setTimeout(()=>{ state.youPose="guard"; state.foePose="guard"; tellTimer=setTimeout(openTell,260+Math.random()*240); },520);
}
function endBout(win){
  state.live=false; clearInterval(tick); clearTimeout(tellTimer); state.fought=state.ladder;
  const fought=BOTS[Math.min(state.fought,BOTS.length-1)];
  if(win){ state.wins+=1; if(state.ladder<BOTS.length-1) state.ladder+=1; }
  else state.losses+=1;
  persist();
  $("resTitle").textContent=win?"Victory":"Defeat";
  $("resKicker").textContent="The mask";
  $("resMask").textContent="\u201c"+(win?fought.maskWin:fought.maskLose)+"\u201d";
  $("resLine").textContent=win?(fought.name+" drops. "+bot().name+" is waiting."):(fought.name+" is still standing.");
  $("fightAgain").textContent=win?("Fight "+bot().name):"Fight again";
  setTimeout(()=>show("result"),420);
}
$("playNow").onclick=startFight;
$("fightAgain").onclick=startFight;
$("againSame").onclick=()=>{state.ladder=state.fought||0; startFight();};
document.querySelectorAll("#skills button").forEach(btn=>btn.onclick=()=>answer(btn.dataset.s));
document.addEventListener("keydown",e=>{
  if(e.repeat)return;
  const map={a:"line",s:"measure",d:"opening",q:"line",w:"measure",e:"opening"};
  const id=map[e.key.toLowerCase()]; if(id) answer(id);
});
window.addEventListener("resize",sizeCanvas);
sizeCanvas();
raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
